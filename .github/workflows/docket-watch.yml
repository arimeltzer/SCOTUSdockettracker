name: SCOTUS Docket Watcher

on:
  schedule:
    # Every 15 minutes, offset 3 minutes past each quarter-hour. GitHub's
    # own docs warn that "schedule" runs are most likely to be delayed or
    # dropped right at busy top-of-quarter-hour marks (:00/:15/:30/:45),
    # since every repo's on-the-hour cron piles up at once -- landing a
    # few minutes off that avoids the worst of the queue. GitHub Actions
    # cron is still best-effort beyond that and can slip a few minutes,
    # and a scheduled workflow auto-disables after 60 days with no repo
    # activity (a push or manual workflow_dispatch run re-enables it).
    # Adjust the cadence here if you want.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scotus-docket-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run docket watcher
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 scotus_docket_watcher.py

      - name: Commit updated state
        run: |
          git config user.name "scotus-docket-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update docket watcher state [skip ci]"
            git push
          fi
